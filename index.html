<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - IZAX Agent</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body { background:#020617; color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
.header { text-align:center; padding:30px 20px 10px; }
.core { width:140px; height:140px; border-radius:50%; background:#0ea5e9; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:#020617; letter-spacing:2px; box-shadow:0 0 0 12px #0ea5e922, 0 0 0 26px #0ea5e911, 0 0 60px #0ea5e9; margin:20px auto; }
.ring { width:210px; height:210px; border:1px solid #0ea5e955; border-radius:50%; position:absolute; top:95px; }
.status { color:#22c55e; font-size:13px; letter-spacing:2px; font-weight:700; margin-top:10px; }
.subtitle { color:#94a3b8; font-size:14px; margin-top:6px; }
.chat { width:100%; max-width:680px; flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.msg { padding:14px 16px; border-radius:14px; max-width:85%; line-height:1.5; font-size:15px; white-space:pre-wrap; }
.msg.jarvis { background:#0f172a; border:1px solid #1e293b; align-self:flex-start; }
.msg.user { background:#0ea5e9; color:#020617; font-weight:600; align-self:flex-end; }
.label { font-size:11px; letter-spacing:1.5px; font-weight:800; margin-bottom:6px; opacity:0.7; }
.controls { width:100%; max-width:680px; padding:12px 20px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.btn { background:#0f172a; border:1px solid #1e293b; color:#fff; padding:9px 14px; border-radius:999px; font-size:13px; cursor:pointer; }
.btn:hover { background:#0ea5e9; color:#020617; }
.input-area { width:100%; max-width:680px; padding:14px 20px 22px; display:flex; gap:10px; }
input { flex:1; background:#0f172a; border:1px solid #1e293b; color:#fff; padding:14px 16px; border-radius:999px; outline:none; font-size:15px; }
.send { background:#0ea5e9; color:#020617; border:none; padding:0 22px; border-radius:999px; font-weight:800; cursor:pointer; }
.lang { font-size:12px; color:#94a3b8; text-align:center; padding-bottom:4px; }
</style>
</head>
<body>
<div class="header">
<div style="position:relative; display:flex; justify-content:center;"><div class="ring"></div><div class="core">JARVIS</div></div>
<div class="status">JARVIS AGENT - ONLINE</div>
<div class="subtitle">IZAX Personal AI Agent. English by default. Auto-detects client language.</div>
</div>
<div class="chat" id="chat"></div>
<div class="controls">
<button class="btn" onclick="quick('I need a Logo')">Logo Design</button>
<button class="btn" onclick="quick('I need a Website')">Website</button>
<button class="btn" onclick="quick('What are your prices?')">Prices</button>
<button class="btn" onclick="quick('I want to place an order')">Place Order</button>
</div>
<div class="lang" id="langLabel">Detected Language: English</div>
<div class="input-area">
<input id="input" placeholder="Type a message to JARVIS..." onkeydown="if(event.key==='Enter') send()" />
<button class="send" onclick="send()">SEND</button>
</div>
<script src="script.js"></script>
</body>
</html>
