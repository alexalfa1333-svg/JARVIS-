<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS - IZAX AI Agent</title>
<style>
:root{
  --bg:#020617; --panel:#0b1226; --line:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
  --accent:#38bdf8; --accent-ink:#021019; --ok:#22c55e;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans','Noto Sans Tamil','Noto Sans Sinhala',Arial,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* Header */
.header{text-align:center;padding:18px 20px 6px;width:100%;max-width:680px}
.orb-wrap{position:relative;width:120px;height:120px;margin:0 auto 12px;display:grid;place-items:center}
.ring{position:absolute;inset:-12px;border:1px solid #38bdf855;border-top-color:var(--accent);border-radius:50%;animation:spin 14s linear infinite}
.core{width:92px;height:92px;border-radius:50%;background:var(--accent);display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:2.5px;color:var(--accent-ink);
  box-shadow:0 0 0 8px #38bdf822,0 0 0 18px #38bdf80f,0 0 40px #38bdf8aa}
.core.thinking{animation:pulse 1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
.status{color:var(--ok);font-size:12px;letter-spacing:2px;font-weight:700}
.subtitle{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.45}

/* Chat */
.chat{width:100%;max-width:680px;flex:1;min-height:0;padding:12px 18px;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{padding:12px 15px;border-radius:16px;max-width:86%;line-height:1.55;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.jarvis{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.msg.user{background:var(--accent);color:var(--accent-ink);font-weight:600;align-self:flex-end;border-top-right-radius:4px}
.msg a{color:inherit;text-decoration:underline;word-break:break-all}
.label{font-size:10.5px;letter-spacing:1.5px;font-weight:800;margin-bottom:4px;opacity:.6}
.typing span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Quick buttons */
.controls{width:100%;max-width:680px;padding:8px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:999px;
  font-size:13px;cursor:pointer;transition:.15s}
.btn:hover,.btn:focus-visible{background:var(--accent);color:var(--accent-ink);outline:none}

/* Language row */
.lang{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--muted);padding:2px 18px 6px}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;outline:none;max-width:60%}
select:focus{border-color:var(--accent)}

/* Input */
.input-area{width:100%;max-width:680px;padding:6px 18px 18px;display:flex;gap:10px}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:14px 16px;
  border-radius:999px;outline:none;font-size:16px}
input:focus{border-color:var(--accent)}
.send{background:var(--accent);color:var(--accent-ink);border:none;padding:0 22px;border-radius:999px;font-weight:800;cursor:pointer}
.send:focus-visible{outline:2px solid #fff}

@media (prefers-reduced-motion:reduce){.ring,.core.thinking,.typing span{animation:none}}
</style>
</head>
<body>

<div class="header">
  <div class="orb-wrap">
    <div class="ring"></div>
    <div class="core" id="core">JARVIS</div>

<div class="controls" id="controls"></div>

<div class="lang">

  <select id="langSel" onchange="manualLang(this.value)"></select>
</div>

<div class="input-area">
  <input id="input" dir="auto" placeholder="Type a message to JARVIS..." autocomplete="off"
         onkeydown="if(event.key==='Enter') send()" />
  <button class="send" onclick="send()">SEND</button>

  if (/[\u0400-\u04FF]/.test(text)) return "ru";
  // 2) Latin-script: score by words + accents
  const tokens = text.toLowerCase().split(/[^a-zA-Zà-ÿşğıİñ¿¡'’]+/).filter(Boolean);
  const score = {};
  for (const k in WORDS) score[k] = tokens.filter(t => WORDS[k].includes(t)).length;
  for (const [k, re] of ACCENT) if (re.test(text.toLowerCase())) score[k] = (score[k] || 0) + 1;
  let best = null, max = 0;
  for (const k in score) if (score[k] > max) { max = score[k]; best = k; }
  return best;            // null = not sure, keep current language
}

/* ================= INTENT (multilingual keywords) ================= */
const K = {
  order:["order","buy","confirm","pedido","pedir","commande","commander","bestell","pesan","sipariş","siparis","заказ","订购","下单","订单","注文","주문","ஆர்டர்","ඇණවුම","ඕඩර්","ऑर्डर","आर्डर","طلب","آرڈر","অর্ডার","ఆర్డర్","ഓർഡർ"],
  price:["price","cost","how much","vilai","evlo","evvalavu","precio","cuánto","cuanto","prix","combien","tarif","preis","preço","preco","quanto","harga","berapa","fiyat","цен","сколько","价","多少","価格","料金","値段","いくら","가격","얼마","விலை","எவ்வளவு","கட்டணம்","මිල","कीमत","दाम","मूल्य","कितना","कितने","سعر","أسعار","اسعار","بكم","قیمت","کتنا","দাম","মূল্য","কত","ధర","ఎంత","വില","എത്ര"],
  logo:["logo","лого","标志","徽标","ロゴ","로고","லோகோ","ලාංඡන","ලෝගෝ","लोगो","شعار","لوغو","لوجو","لوگو","লোগো","లోగో","ലോഗോ"],
  web:["web","site","sitio","página","pagina","sayfa","situs","seite","сайт","网","ウェブ","ホームページ","サイト","웹","வெப்","இணையதள","වෙබ්","वेब","موقع","ويب","ویب","ওয়েব","వెబ్","വെബ്"],
  thanks:["thank","nandri","gracias","merci","danke","obrigad","спасибо","谢谢","感谢","ありがとう","감사","고마","teşekkür","tesekkur","terima kasih","நன்றி","ස්තූති","धन्यवाद","शुक्रिया","شكر","شکریہ","ধন্যবাদ","ధన్యవాదాలు","നന്ദി"]
};
const HELLO_TOKENS = ["hi","hii","hello","hey","hai","vanakkam","hola","bonjour","salut","hallo","olá","ola","halo","merhaba","selam","привет"];
const HELLO_INCLUDES = ["வணக்கம்","ආයුබෝවන්","හෙලෝ","नमस्ते","हैलो","مرحبا","السلام","سلام","اهلا","أهلا","নমস্কার","হ্যালো","నమస్కారం","హలో","നമസ്കാരം","ഹലോ","здравствуйте","你好","您好","こんにちは","안녕"];

function intent(text){
  const s = text.toLowerCase();
  for (const key of ["order","price","logo","web","thanks"])
    if (K[key].some(w => s.includes(w))) return key;
  const tokens = s.split(/[\s,.!?]+/).filter(Boolean);
  if (tokens.some(t => HELLO_TOKENS.includes(t))) return "hello";
  if (s.length < 30 && HELLO_INCLUDES.some(w => s.includes(w))) return "hello";
  return "fb";
}

/* ================= BUILD REPLY ================= */
function build(key){
  const L = LANG[cur];
  const fill = t => t.replace("{brand}", CONFIG.brand)
                     .replace("{wa}", "https://wa.me/" + CONFIG.whatsapp)
                     .replace("{mail}", CONFIG.email);
  if (key === "price")
    return L.price[0] + "\n\n• " + CONFIG.prices.logo + "\n• " + CONFIG.prices.website +
           "\n• " + CONFIG.prices.social + "\n\n" + L.price[1];
  return fill(L[key]);
}

/* ================= UI ================= */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const core = document.getElementById("core");
const sel = document.getElementById("langSel");
const controls = document.getElementById("controls");
const BTN_KEYS = ["logo","web","price","order"];
let cur = "en";
let manual = false;

function fillText(el, text){
  text.split(/(https?:\/\/[^\s]+)/g).forEach((part, i) => {
    if (i % 2) {
      const a = document.createElement("a");
      a.href = part; a.target = "_blank"; a.rel = "noopener"; a.textContent = part;
      el.appendChild(a);
    } else el.appendChild(document.createTextNode(part));
  });
}

function add(who, text){
  const d = document.createElement("div");
  d.className = "msg " + who;
  const l = document.createElement("div");
  l.className = "label";
  l.textContent = who === "user" ? "YOU" : "JARVIS";
  const b = document.createElement("div");
  b.dir = "auto";
  if (text) fillText(b, text);
  d.append(l, b);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function reply(key){
  const t = add("jarvis", "");
  const body = t.lastChild;
  body.className = "typing";
  body.innerHTML = "<span></span><span></span><span></span>";
  core.classList.add("thinking");
  setTimeout(() => {
    t.remove();
    core.classList.remove("thinking");
    add("jarvis", build(key));
  }, 600);
}

function renderButtons(){
  controls.innerHTML = "";
  LANG[cur].lb.forEach((label, i) => {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = label;
    b.onclick = () => { add("user", label); reply(BTN_KEYS[i]); };
    controls.appendChild(b);
  });
}

function setLang(k){
  cur = k;
  renderButtons();
  sel.options[0].textContent = "Auto-detect (" + LANG[cur].n + ")";
  document.documentElement.lang = k === "tg" ? "ta-Latn" : k;
}

function manualLang(v){
  if (v === "auto") { manual = false; setLang(cur); }
  else { manual = true; setLang(v); }
}

function send(){
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  add("user", text);
  if (!manual) { const d = detect(text); if (d) setLang(d); }
  reply(intent(text));
}

/* Init */
(function(){
  const auto = document.createElement("option");
  auto.value = "auto"; sel.appendChild(auto);
  Object.keys(LANG).forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = LANG[k].n; sel.appendChild(o);
  });
  sel.value = "auto";
  setLang("en");
  add("jarvis", build("hello"));
})();
</script>
