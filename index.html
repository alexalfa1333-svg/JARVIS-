<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS - IZAX AI Agent</title>
<style>
:root{--bg:#020617;--panel:#0b1226;--line:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8;--ink:#021019;--ok:#22c55e}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans','Noto Sans Tamil','Noto Sans Sinhala',Arial,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.header{text-align:center;padding:14px 20px 4px;width:100%;max-width:680px}
.orb{position:relative;width:96px;height:96px;margin:0 auto 10px;display:grid;place-items:center}
.ring{position:absolute;inset:-10px;border:1px solid #38bdf855;border-top-color:var(--accent);border-radius:50%;animation:spin 14s linear infinite}
.core{width:74px;height:74px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:2px;color:var(--ink);box-shadow:0 0 0 6px #38bdf822,0 0 0 14px #38bdf80f,0 0 34px #38bdf8aa}
.core.thinking{animation:pulse 1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
.status{color:var(--ok);font-size:12px;letter-spacing:2px;font-weight:700}
.subtitle{color:var(--muted);font-size:12px;margin-top:4px}
.chat{width:100%;max-width:680px;flex:1;min-height:0;padding:12px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{padding:12px 15px;border-radius:16px;max-width:88%;line-height:1.55;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.jarvis{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.msg.user{background:var(--accent);color:var(--ink);font-weight:600;align-self:flex-end;border-top-right-radius:4px}
.msg a{color:inherit;text-decoration:underline;word-break:break-all}
.label{font-size:10.5px;letter-spacing:1.5px;font-weight:800;margin-bottom:4px;opacity:.6}
.typing span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.card{align-self:flex-start;width:min(88%,340px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.card svg,.card img{width:100%;height:auto;border-radius:12px;display:block;background:#fff}
.card .note{font-size:12px;color:var(--muted);margin:8px 0 2px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.controls{width:100%;max-width:680px;padding:6px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 13px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover,.btn:focus-visible{background:var(--accent);color:var(--ink);outline:none}
.lang{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--muted);padding:2px 18px 6px}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;outline:none;max-width:60%}
.input-area{width:100%;max-width:680px;padding:6px 18px 16px;display:flex;gap:10px}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:14px 16px;border-radius:999px;outline:none;font-size:16px}
input:focus{border-color:var(--accent)}
.send{background:var(--accent);color:var(--ink);border:none;padding:0 22px;border-radius:999px;font-weight:800;cursor:pointer}
@media (prefers-reduced-motion:reduce){.ring,.core.thinking,.typing span{animation:none}}
</style>
</head>

function detect(t){
  if (/[\u0B80-\u0BFF]/.test(t)) return "ta";
  if (/[\u0D80-\u0DFF]/.test(t)) return "si";
  if (/[\u0900-\u097F]/.test(t)) return "hi";
  const w = t.toLowerCase().split(/[^a-z]+/);
  return w.some(x => TANGLISH.includes(x)) ? "tg" : null;
}

const MOODS = {
  love:  {kw:["love","family","mom","amma","appa","heart","wedding","kadhal","anbu","அன்பு","அம்மா","காதல்","ආදරය","අම්මා","प्यार","परिवार"],c:["#e11d48","#f97316"],tag:"Made with love",ai:"heart symbol, warm, caring"},
  dream: {kw:["dream","first","start","new","begin","hope","kanavu","kanavu","கனவு","ஆரம்ப","සිහින","सपना"],c:["#2563eb","#7c3aed"],tag:"Dream big",ai:"rising star, rocket, hopeful"},
  power: {kw:["strong","power","bold","gym","fight","fit","valimai","பலம்","வலிமை","ශක්ති","ताकत"],c:["#111827","#d4a017"],tag:"Built strong",ai:"lightning bolt, strong, powerful"},
  nature:{kw:["nature","organic","green","farm","garden","herbal","iyarkai","இயற்கை","ස්වභාවය","प्रकृति"],c:["#15803d","#65a30d"],tag:"Naturally yours",ai:"leaf, natural, organic"},
  joy:   {kw:["happy","fun","kids","joy","sweet","cake","food","magizhchi","மகிழ்ச்சி","සතුට","खुशी"],c:["#f59e0b","#ef4444"],tag:"Pure joy",ai:"sun, cheerful, bright"}
};
const MOOD_KW = Object.fromEntries(Object.entries(MOODS).map(([k, v]) => [k, v.kw]));
const COLORS = {red:"#e11d48",sivappu:"#e11d48",blue:"#2563eb",neelam:"#2563eb",green:"#16a34a",pachai:"#16a34a",yellow:"#eab308",orange:"#f97316",purple:"#7c3aed",pink:"#ec4899",black:"#111827",gold:"#d4a017",teal:"#0d9488"};
const STYLES = {minimal:["minimal","simple","clean"],classic:["classic","traditional","vintage"],modern:["modern","new look","trendy"]};

function intent(t){
  const s = t.toLowerCase();
  for (const k of ["order","price","logo","web","thanks"]) if (K[k].some(w => s.includes(w))) return k;
  if (s.split(/[\s,.!?]+/).some(w => HELLO.includes(w))) return "hello";
  return "fb";
}
function pick(s, map){ for (const k in map) if (map[k].some(w => s.includes(w))) return k; return null; }
function feelsEmotional(s){ return /feel|emotion|special|means|memory|உணர்|දැනෙ|महसूस|unar|romba/.test(s); }

function extractName(t){
  let m = t.match(/["“']([^"”']{2,28})["”']/);
  if (!m) m = t.match(/(?:name is|named|called|peyar|பெயர்|නම|नाम|business is|brand is)\s*(?:is|:)?\s*([^,.!?\n]{2,40})/i);
  if (!m) return null;
  return m[1].split(/\s+(?:and|but|because|it|ennaku|enakku|logo)\s+/i)[0].trim().slice(0,28);
}

/* ============ LOGO ENGINE (SVG, runs in the browser) ============ */
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, v + amt));
  return "#" + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => f(v).toString(16).padStart(2, "0")).join("");
}
function star(cx, cy, R, r){
  let p = [];
  for (let i = 0; i < 10; i++){
    const a = Math.PI / 5 * i - Math.PI / 2, rad = i % 2 ? r : R;
    p.push((cx + rad * Math.cos(a)).toFixed(1) + "," + (cy + rad * Math.sin(a)).toFixed(1));
  }
  return `<polygon points="${p.join(" ")}"/>`;
}
function symbol(mood, name){
  switch (mood){
    case "love":   return `<path d="M256 285C140 205 165 105 220 105c24 0 36 18 36 32 0-14 12-32 36-32 55 0 80 100-36 180z"/>`;
    case "dream":  return star(256, 195, 90, 38);
    case "power":  return `<path d="M285 95l-80 110h48l-26 90 88-125h-50z"/>`;
    case "nature": return `<path d="M256 290C160 265 150 150 275 100c70 55 60 155-19 190z"/><path d="M256 290C256 220 262 170 275 130" stroke="#0003" stroke-width="6" fill="none"/>`;
    case "joy":    { let r = ""; for (let i = 0; i < 8; i++) r += `<rect x="251" y="95" width="10" height="34" rx="5" transform="rotate(${i * 45} 256 195)"/>`; return `<circle cx="256" cy="195" r="44"/>` + r; }
    default:       return `<text x="256" y="238" text-anchor="middle" font-size="130" font-weight="800" font-family="Georgia,serif">${esc(name[0].toUpperCase())}</text>`;
  }
}
function makeLogo(o){
  const M = MOODS[o.mood] || {c:["#0284c7","#38bdf8"],tag:"Quality first"};
  const c1 = o.color || M.c[0], c2 = o.color ? shade(o.color, 60) : M.c[1];
  const name = o.name.toUpperCase(), size = Math.max(26, Math.min(58, 520 / name.length));
  const minimal = o.style === "minimal", classic = o.style === "classic";
  const fill = minimal ? c1 : "#fff";
  const badge = minimal ? "" : classic
    ? `<rect x="106" y="45" width="300" height="300" rx="40" fill="url(#g)"/><rect x="120" y="59" width="272" height="272" rx="30" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>`
    : `<circle cx="256" cy="195" r="150" fill="url(#g)"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="512" height="512" fill="#fff"/>${badge}<g fill="${fill}">${symbol(o.mood, o.name)}</g><text x="256" y="425" text-anchor="middle" font-size="${size}" font-weight="800" letter-spacing="4" fill="${c1}" font-family="Segoe UI,Arial,sans-serif">${esc(name)}</text><text x="256" y="463" text-anchor="middle" font-size="19" letter-spacing="5" fill="#64748b" font-family="Segoe UI,Arial,sans-serif">${M.tag.toUpperCase()}</text></svg>`;
}
function download(href, file){ const a = document.createElement("a"); a.href = href; a.download = file; document.body.appendChild(a); a.click(); a.remove(); }
function svgToPng(svg, file){
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = c.height = 1024;
    c.getContext("2d").drawImage(img, 0, 0, 1024, 1024);
    download(c.toDataURL("image/png"), file);
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* ============ UI ============ */
const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), core = $("core"), sel = $("langSel"), controls = $("controls");
const BTN = ["logo","web","price","order"];
let cur = "en", manual = false;
let ctx = {awaiting:false, mood:null, style:null, color:null, last:null};

const fmt = t => t.replace("{b}", CONFIG.brand).replace("{m}", CONFIG.email)
  .replace("{wa}", "https://wa.me/" + CONFIG.whatsapp + (ctx.last ? "?text=" + encodeURIComponent("Hi, I want this logo: " + ctx.last) : ""));

function fillText(el, text){
  text.split(/(https?:\/\/[^\s]+)/g).forEach((p, i) => {
    if (i % 2){ const a = document.createElement("a"); a.href = p; a.target = "_blank"; a.rel = "noopener"; a.textContent = p; el.appendChild(a); }
    else el.appendChild(document.createTextNode(p));
  });
}
function add(who, text){
  const d = document.createElement("div"); d.className = "msg " + who;
  const l = document.createElement("div"); l.className = "label"; l.textContent = who === "user" ? "YOU" : "JARVIS";
  const b = document.createElement("div"); b.dir = "auto"; if (text) fillText(b, text);
  d.append(l, b); chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function mkBtn(label, fn){ const b = document.createElement("button"); b.className = "btn"; b.textContent = label; b.onclick = fn; return b; }

function say(text, delay = 600, after){
  const t = add("jarvis", ""), body = t.lastChild;
  body.className = "typing"; body.innerHTML = "<span></span><span></span><span></span>";
  core.classList.add("thinking");
  setTimeout(() => { t.remove(); core.classList.remove("thinking"); add("jarvis", text); if (after) after(); }, delay);
}

function reply(key){
  const L = LANG[cur];
  if (key === "price") return say(L.price[0] + "\n\n• " + CONFIG.prices.join("\n• ") + "\n\n" + L.price[1]);
  if (key === "hello") return say(fmt(L.hello));
  if (key === "logo"){ ctx.awaiting = true; return say(L.ask); }
  say(fmt(L[key]));
}

function showLogo(o){
  const L = LANG[cur], svg = makeLogo(o);
  ctx.last = o.name; ctx.awaiting = false;
  say(L.emo.replace(/\{n\}/g, o.name), 1400, () => {
    const card = document.createElement("div"); card.className = "card";
    const box = document.createElement("div"); box.innerHTML = svg; card.appendChild(box);
    const note = document.createElement("div"); note.className = "note"; note.dir = "auto"; note.textContent = L.note.replace("{n}", o.name); card.appendChild(note);
    const row = document.createElement("div"); row.className = "row";
    const file = o.name.replace(/\W+/g, "_") || "logo";
    row.append(
      mkBtn(L.dl, () => svgToPng(svg, file + ".png")),
      mkBtn(L.sv, () => download("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg), file + ".svg")),
      mkBtn(L.ai, () => aiArt(o)),
      mkBtn(L.od, () => { add("user", L.od); reply("order"); })
    );
    card.appendChild(row); chat.appendChild(card); chat.scrollTop = chat.scrollHeight;
    ctx.mood = ctx.style = ctx.color = null;
  });
}

function aiArt(o){
  const L = LANG[cur], M = MOODS[o.mood] || {ai:"abstract symbol"};
  const wait = add("jarvis", L.wait);
  const prompt = `professional minimalist vector logo for a brand called ${o.name}, ${M.ai}, ${o.style || "modern"} style, flat design, centered, white background`;
  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) + "?width=512&height=512&nologo=true&seed=" + Math.floor(Math.random() * 99999);
  const card = document.createElement("div"); card.className = "card";
  const img = new Image(); img.alt = "AI logo for " + o.name;
  img.onload = () => {
    wait.remove(); card.appendChild(img);
    const row = document.createElement("div"); row.className = "row";
    row.append(mkBtn(L.dl, () => window.open(url, "_blank")), mkBtn(L.ai, () => aiArt(o)));
    card.appendChild(row); chat.appendChild(card); chat.scrollTop = chat.scrollHeight;
  };
  img.onerror = () => { wait.remove(); add("jarvis", L.fail); };
  img.src = url;
}

/* Decide: is this message part of a logo request? */
function handleLogo(text){
  const s = text.toLowerCase();
  ctx.mood = pick(s, MOOD_KW) || ctx.mood;
  ctx.style = pick(s, STYLES) || ctx.style;
  ctx.color = COLORS[Object.keys(COLORS).find(c => s.includes(c))] || ctx.color;
  let name = extractName(text);
  if (!name && ctx.awaiting){
    const guess = text.split(/[,.\n]/)[0].trim();
    if (guess.length >= 2 && guess.length <= 28 && !K.logo.some(w => guess.toLowerCase() === w)) name = guess;
  }
  if (!name){ ctx.awaiting = true; say(LANG[cur].ask); return; }
  if (!ctx.mood && feelsEmotional(s)) ctx.mood = "love";
  showLogo({name, mood: ctx.mood, style: ctx.style, color: ctx.color});
}

function renderButtons(){
  controls.innerHTML = "";
  LANG[cur].lb.forEach((label, i) => controls.appendChild(mkBtn(label, () => { add("user", label); reply(BTN[i]); })));
}
function setLang(k){
  cur = k; renderButtons();
  sel.options[0].textContent = "Auto-detect (" + LANG[cur].n + ")";
  document.documentElement.lang = k === "tg" ? "ta-Latn" : k;
}
function manualLang(v){ if (v === "auto"){ manual = false; setLang(cur); } else { manual = true; setLang(v); } }

function send(){
  const text = input.value.trim(); if (!text) return;
  input.value = ""; add("user", text);
  if (!manual){ const d = detect(text); if (d) setLang(d); }
  const key = intent(text);
  if (key === "logo" || (ctx.awaiting && !["order","price","thanks"].includes(key)) || (key === "fb" && extractName(text) && /logo|லோகோ/i.test(text))) return handleLogo(text);
  reply(key);
}

(function init(){
  const auto = document.createElement("option"); auto.value = "auto"; sel.appendChild(auto);
  Object.keys(LANG).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = LANG[k].n; sel.appendChild(o); });
  sel.value = "auto"; setLang("en"); add("jarvis", fmt(LANG.en.hello));
})();
</script>
</body>
